[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
    "crates/spike-win",
    "crates/win-capture",
    "crates/spike-send",
    "crates/receiver-desktop",
    "crates/mac-capture",
    "crates/linux-capture",
    "crates/cast-google",
    "tools/icongen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/redharegames/NANOCast"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
nanocast-core = { path = "crates/core" }
nanocast-win = { path = "crates/win-capture" }
nanocast-mac = { path = "crates/mac-capture" }
nanocast-linux = { path = "crates/linux-capture" }
nanocast-cast = { path = "crates/cast-google" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
