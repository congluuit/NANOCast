[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
    "crates/spike-win",
    "crates/spike-send",
    "tools/icongen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/redharegames/NANOCast"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
nanocast-core = { path = "crates/core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
