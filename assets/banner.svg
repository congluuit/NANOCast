<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Android TV launcher banner (320x180 dp, rendered at xhdpi = 640x360 px). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B3A"/>
      <stop offset="1" stop-color="#123C7A"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- Mark (same geometry as icon.svg, scaled to 240 px and shifted) -->
  <g transform="translate(40 60) scale(0.47)">
    <rect x="96" y="120" width="352" height="232" rx="28" fill="none" stroke="#FFFFFF" stroke-width="26"/>
    <rect x="126" y="150" width="292" height="172" rx="12" fill="url(#beam)"/>
    <rect x="232" y="352" width="48" height="30" fill="#FFFFFF"/>
    <rect x="184" y="382" width="144" height="22" rx="11" fill="#FFFFFF"/>
    <circle cx="96" cy="404" r="26" fill="#0B1B3A"/>
    <circle cx="96" cy="404" r="16" fill="#FFFFFF"/>
    <path d="M96 346 a58 58 0 0 1 58 58" fill="none" stroke="#0B1B3A" stroke-width="34" stroke-linecap="round"/>
    <path d="M96 346 a58 58 0 0 1 58 58" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
    <path d="M96 296 a108 108 0 0 1 108 108" fill="none" stroke="#0B1B3A" stroke-width="34" stroke-linecap="round"/>
    <path d="M96 296 a108 108 0 0 1 108 108" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="284" y="180" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="62" font-weight="700" fill="#FFFFFF">NANO<tspan fill="#22D3EE">Cast</tspan></text>
  <text x="286" y="222" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#B6C6E3">Cast màn hình, không trễ</text>
</svg>
