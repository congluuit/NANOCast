name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Installer + portable zip
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The tag must match [workspace.package] version in Cargo.toml (v0.2.0 <-> 0.2.0).
      - name: Check version
        id: version
        shell: pwsh
        run: |
          $version = $null
          foreach ($line in Get-Content Cargo.toml) {
            if ($line -match '^\s*version\s*=\s*"([^"]+)"') { $version = $Matches[1]; break }
          }
          $tag = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($version -ne $tag) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: cargo build --release
        run: cargo build --release -p nanocast

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\nanocast.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Portable zip
        shell: pwsh
        run: ./installer/make-portable.ps1 -NoBuild

      # The bare exe: portable copies update themselves with it (crates/app/src/update.rs).
      - name: Portable exe
        shell: pwsh
        run: Copy-Item target/release/nanocast.exe "installer/out/NANOCast-${{ steps.version.outputs.version }}-portable-win64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            installer/out/NANOCast-Setup-*.exe
            installer/out/NANOCast-*-portable-win64.zip
            installer/out/NANOCast-*-portable-win64.exe
          if-no-files-found: error

  android:
    name: Android TV receiver APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # TVs update the app themselves (Updater.kt), which Android only allows when every
      # release is signed with the same key: keep it in the repository secrets
      # (docs/play-store.md, "Ký APK trên GitHub").
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with this runner's throwaway debug key, so TVs cannot update over it."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NANOCAST_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: gradlew assembleRelease
        working-directory: receiver-androidtv
        env:
          NANOCAST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NANOCAST_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NANOCAST_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp receiver-androidtv/app/build/outputs/apk/release/app-release.apk "dist/NANOCast-Receiver-${TAG#v}-androidtv.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  macos:
    name: macOS .dmg (universal)
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Version check is done by the windows job (needs: windows).
      - name: build-mac.sh
        run: bash installer/macos/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: installer/out/NANOCast-*-macos-universal.dmg
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [windows, android, macos]
    # The macOS build is not verified on real hardware yet: if only it fails, still publish
    # the Windows installer and APK (the .dmg is then simply missing from the release).
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "NANOCast $VERSION" \
            --generate-notes
