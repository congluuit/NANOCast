name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Non-blocking until the codebase has been run through `cargo fmt --all` once;
      # then delete continue-on-error so formatting is enforced.
      - name: cargo fmt
        continue-on-error: true
        run: cargo fmt --all -- --check
      # Warnings are reported but do not fail the build (no -D warnings).
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  windows:
    name: Windows build + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release --workspace
      - name: cargo test
        run: cargo test --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: nanocast-exe
          path: target/release/nanocast.exe
          if-no-files-found: error

  android:
    name: Android TV receiver APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: receiver-androidtv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: gradlew assembleDebug
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: receiver-androidtv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Phase 3 groundwork: core + desktop receiver on macOS / Linux. Not required to pass yet.
  unix:
    name: ${{ matrix.os }} (core + receiver)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages (ALSA for cpal, X11/Wayland for winit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev
      - name: cargo build
        run: cargo build -p nanocast-core -p nanocast-receiver
