name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Non-blocking until the codebase has been run through `cargo fmt --all` once;
      # then delete continue-on-error so formatting is enforced.
      - name: cargo fmt
        continue-on-error: true
        run: cargo fmt --all -- --check
      # Warnings are reported but do not fail the build (no -D warnings).
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  windows:
    name: Windows build + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release --workspace
      - name: cargo test
        run: cargo test --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: nanocast-exe
          path: target/release/nanocast.exe
          if-no-files-found: error

  android:
    name: Android TV receiver APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: receiver-androidtv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: gradlew assembleDebug
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: receiver-androidtv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # GUI (nanocast) for Intel and Apple Silicon. Build only: linking needs the macOS SDK, but
  # running needs Screen Recording permission, which a CI runner cannot grant.
  macos:
    name: macOS GUI (x86_64 + arm64)
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.3"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release (Apple Silicon)
        run: cargo build --release -p nanocast --target aarch64-apple-darwin
      - name: cargo build --release (Intel)
        run: cargo build --release -p nanocast --target x86_64-apple-darwin
      - name: cargo test (pure-Rust parts of nanocast-mac, core)
        run: cargo test -p nanocast-mac -p nanocast-core
      - name: Universal binary
        run: |
          lipo -create target/aarch64-apple-darwin/release/nanocast target/x86_64-apple-darwin/release/nanocast -output nanocast-universal
          lipo -info nanocast-universal

  # Phase 3 groundwork: core + desktop receiver on Linux. Not required to pass yet.
  linux:
    name: ubuntu-latest (core + receiver)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages (ALSA for cpal, X11/Wayland for winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev
      - name: cargo build
        run: cargo build -p nanocast-core -p nanocast-receiver
