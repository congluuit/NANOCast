[package]
name = "nanocast-mac"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NANOCast macOS sender pipeline: ScreenCaptureKit capture + VideoToolbox H.264 -> UDP"

[dependencies]
nanocast-core.workspace = true
anyhow.workspace = true
log.workspace = true

# Everything below is only compiled for macOS; on Windows/Linux the crate is empty.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-media = { version = "0.3", features = ["objc2-core-audio-types", "objc2-core-video"] }
objc2-core-video = "0.3"
objc2-video-toolbox = { version = "0.3", features = ["objc2-core-media", "objc2-core-video"] }
objc2-screen-capture-kit = { version = "0.3", features = ["objc2-core-media", "objc2-core-graphics", "block2", "dispatch2"] }
block2 = "0.6"
dispatch2 = "0.3"

[dev-dependencies]
env_logger.workspace = true
