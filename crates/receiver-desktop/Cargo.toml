[package]
name = "nanocast-receiver"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NANOCast receiver for a PC / Raspberry Pi plugged into a TV or projector over HDMI"

[dependencies]
nanocast-core.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
# Software H.264 decoder (Cisco OpenH264, built from bundled source; no FFmpeg/libclang needed).
# Behind the `VideoDecoder` trait so an FFmpeg / platform HW decoder can replace it later.
openh264 = "0.9"
winit = "0.30"
wgpu = { version = "25", default-features = false, features = ["wgsl", "dx12", "metal", "vulkan", "gles"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.18"
socket2 = "0.6"
gethostname = "1"
if-addrs = "0.15"
serde_json = "1"
