[package]
name = "nanocast"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
description = "NANOCast: cast your screen or one app to a TV on the same network"

[dependencies]
nanocast-core.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true

[target.'cfg(windows)'.dependencies]
nanocast-win.workspace = true
# glow (OpenGL) instead of wgpu keeps nanocast.exe small; accesskit/links/clipboard are not needed.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
