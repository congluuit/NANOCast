[package]
name = "nanocast"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
description = "NANOCast: cast your screen or one app to a TV on the same network"

[dependencies]
nanocast-core.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
# Settings file (%APPDATA%\NANOCast\config.json, ~/Library/Application Support/NANOCast on macOS).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
# Default GUI language from the system locale.
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
nanocast-win.workspace = true
# glow (OpenGL) instead of wgpu keeps nanocast.exe small; accesskit/links/clipboard are not needed.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }

[target.'cfg(target_os = "macos")'.dependencies]
nanocast-mac.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }

[target.'cfg(target_os = "linux")'.dependencies]
nanocast-linux.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
