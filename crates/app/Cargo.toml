[package]
name = "nanocast"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"
description = "NANOCast: cast your screen or one app to a TV on the same network"

[dependencies]
nanocast-core.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
# Settings file (%APPDATA%\NANOCast\config.json, ~/Library/Application Support/NANOCast on macOS).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
# Google Cast (Chromecast built-in) fallback for TVs without the NANOCast app.
nanocast-cast.workspace = true
# "Install the app on this TV" over Wi-Fi: our own ADB client (RSA auth) and the APK download.
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "u64_digit", "getrandom"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Android 11+ Wireless debugging: pairing code (SPAKE2 as BoringSSL does it, AES-GCM) and
# ADB over TLS 1.3; the TV's ports come from mDNS. ring/rustls are already used by ureq and
# nanocast-cast.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
ring = "0.17"
curve25519-dalek = "4"
mdns-sd = "0.21"

[target.'cfg(windows)'.dependencies]
nanocast-win.workspace = true
# glow (OpenGL) instead of wgpu keeps nanocast.exe small; accesskit/links/clipboard are not needed.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
# Notification-area icon while casting with the window closed, and Ctrl+Shift+P (pause).
tray-icon = { version = "0.26", default-features = false }
global-hotkey = "0.9"
# Show the window again from the tray (a hidden winit window gets no frames).
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
nanocast-mac.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }

[target.'cfg(target_os = "linux")'.dependencies]
nanocast-linux.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
